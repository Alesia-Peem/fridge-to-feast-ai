<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fridge-to-Feast</title>
  <meta name="description" content="จัดการวัตถุดิบในตู้เย็น แล้วให้ AI คิดเมนูจากของที่มี">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="home">
  <main class="wrap">
    <nav class="top">
      <a class="brand" href="/">🍳 Fridge-to-Feast</a>
      <div class="top-links">
        <a href="/fridge">ตู้เย็น</a>
        <a href="/history">ประวัติ</a>
      </div>
    </nav>

    <section class="hero">
      <h1>ใช้ของในตู้เย็นให้หมด<br>ด้วยเมนูจาก AI</h1>
      <p class="lead">จดวัตถุดิบที่มี เลือกสิ่งที่อยากใช้ แล้วให้ AI คิดเมนูพร้อมวิธีทำ ของใกล้หมดอายุจะถูกใช้ก่อน</p>
    </section>

    <div class="stats">
      <div class="stat"><div class="stat-num" id="statItems">0</div><div class="stat-label">วัตถุดิบในตู้เย็น</div></div>
      <div class="stat"><div class="stat-num" id="statSoon">0</div><div class="stat-label">ใกล้หมดอายุ</div></div>
      <div class="stat"><div class="stat-num" id="statMeals">0</div><div class="stat-label">เมนูที่ทำแล้ว</div></div>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="/fridge">ไปที่ตู้เย็นของฉัน →</a>
      <a class="btn" href="/history">ประวัติสูตรอาหาร</a>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
